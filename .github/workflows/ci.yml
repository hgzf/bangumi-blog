name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test & Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check renderer.js
          node --check platform-contract.js
          node --check folder-sync.js
          node --check recommendation-engine.js
          node --check period-report.js
          node --check quarter-report.js
          node --check watch-session.js
          node --check ai-client.js
          node --check image-url.js
          node --check editor-utils.js

      - name: Run unit tests
        run: pnpm test

      - name: Build and validate Capacitor web bundle
        run: |
          pnpm build:web
          pnpm check:web
